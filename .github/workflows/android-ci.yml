name: Android CI

# Dispara em qualquer push, em PR para main e manualmente (aba Actions ou `gh workflow run`).
# Disparo manual: escolha a branch e, se quiser, desligue o E2E (mais lento).
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Rodar o E2E no emulador (:app e :data connectedDebugAndroidTest)"
        type: boolean
        default: true
      python:
        description: "Rodar os testes Python do motor de Mythralis"
        type: boolean
        default: true

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Motor Python de Mythralis: fonte dos vetores de conformidade do módulo :world (D-I2).
  python-motor:
    name: Motor Python (Mythralis)
    if: github.event_name != 'workflow_dispatch' || inputs.python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do motor
        working-directory: Mythralis
        run: python3 -m unittest discover -s motor/testes -v

  # Estilo, testes JVM/Android unitários (inclui :world:test) e APK debug.
  test-and-build:
    name: Estilo, testes e APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Os passos abaixo usam !cancelled() para que uma falha de estilo não esconda o resultado dos testes.
      - name: ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace

      - name: Testes do módulo world (prova da Fase 21)
        if: ${{ !cancelled() }}
        run: ./gradlew :world:test --stacktrace

      - name: Suíte completa
        if: ${{ !cancelled() }}
        run: ./gradlew test --continue --stacktrace

      - name: Build do APK debug
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Relatórios de teste e ktlint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-jvm-test-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/**
            **/build/reports/ktlint/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Esquemas do Room
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-room-schemas
          path: data/schemas/**
          if-no-files-found: warn
          retention-days: 30

      - name: APK debug
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # E2E no emulador (gate do CI, regra Q-05). Fora dos PRs, como antes; no disparo manual pode ser desligado.
  e2e:
    name: E2E no emulador
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: E2E (:app) e migrações Room (:data)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set +e
            adb logcat -c
            adb logcat -v threadtime > e2e-logcat.txt &
            logcat_pid=$!
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            result=$?
            # Q-04: migrações Room. Informativo até a primeira execução verde; depois, trocar para falhar o job.
            ./gradlew :data:connectedDebugAndroidTest --stacktrace
            data_result=$?
            echo "data:connectedDebugAndroidTest exit=$data_result" > data-androidtest-result.txt
            sleep 2
            kill "$logcat_pid" 2>/dev/null || true
            wait "$logcat_pid" 2>/dev/null || true
            exit $result

      - name: Diagnósticos do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-e2e-diagnostics
          path: |
            e2e-logcat.txt
            data-androidtest-result.txt
            app/build/reports/androidTests/connected
            data/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14
