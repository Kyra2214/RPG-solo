name: Android CI

on:
  push:
    branches: [ "main", "implementation/code-first-combat", "feature/racas-subracas" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run JVM and Android tests
        run: ./gradlew test --continue --stacktrace

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-jvm-test-reports
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android E2E on emulator
        if: github.event_name != 'pull_request'
        id: e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            ./scripts/run-android-e2e.sh

      - name: Upload E2E diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-e2e-diagnostics
          path: |
            e2e-logcat.txt
            app/build/reports/androidTests/connected
          if-no-files-found: ignore
          retention-days: 14

      # O E2E é gate do CI; os diagnósticos acima continuam sendo publicados em caso de falha.

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpgsolo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
